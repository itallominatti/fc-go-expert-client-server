version: "3.8"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      # Volume nomeado → o arquivo cotacoes.db sobrevive a restarts e remoção do container
      - cotacoes-data:/app/data
    environment:
      # O server.go lê esta variável para saber onde abrir o SQLite
      - DB_PATH=/app/data/cotacoes.db
    restart: unless-stopped

volumes:
  cotacoes-data:
    driver: local
